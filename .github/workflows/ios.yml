name: iOS TestFlight

# Builds + uploads entropybrush to TestFlight on a release tag (macOS runners
# bill ~10x, so we don't build on every push), plus manual dispatch from the
# Actions tab. Build number is derived automatically — no pubspec bump.
#
#   git tag ios-v1.0.0 && git push origin ios-v1.0.0   →  builds & uploads
#
# Signing: the App Store Connect API key drives cloud provisioning + the upload.
# The persistent team Distribution cert is imported into a throwaway keychain
# first (IOS_P12_BASE64 / IOS_P12_PASSWORD) so automatic signing REUSES it
# instead of minting an "Apple Distribution: Created via API" cert on every
# ephemeral runner (Apple caps distribution certs at 2–3). If those two secrets
# are unset, it falls back to cloud-managed signing.
on:
  push:
    tags:
      - 'ios-v*'
  workflow_dispatch:

jobs:
  build-and-upload:
    # macos-26 ships Xcode 26 (iOS 26 SDK) — App Store Connect rejects uploads
    # built with anything older.
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Select latest Xcode (iOS 26 SDK)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Compile-sanity gate. The repo's tests are diagnostic scripts (print +
      # manual PASS, no `expect`), so `flutter test` exits non-zero ("no tests
      # found"); analyze catches the real compile errors that would break the
      # iOS build. Lint infos/warnings are non-fatal (the tree carries ~108).
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # Marketing version: an explicit release tag (ios-v1.2.0 → 1.2.0), or on a
      # manual build auto-bump to <major.minor>.<run number> so every TestFlight
      # build shows as its own distinct version (no more identical "1.0.0"s to
      # tell apart). Build number stays Unix epoch: monotonic and never undercut
      # by an older upload (TestFlight orders by it); the version is what you read.
      - name: Compute version + build number
        id: ver
        run: |
          REF="${{ github.ref_name }}"
          if [[ "$REF" == ios-v* ]]; then
            VERSION="${REF#ios-v}"
          else
            BASE=$(grep '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([0-9]+\.[0-9]+).*/\1/')
            VERSION="${BASE}.${{ github.run_number }}"
          fi
          BUILD=$(date -u +%s)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION (+$BUILD)"

      # The API key drives cloud provisioning (xcodebuild fetches/creates the
      # profile) and the TestFlight upload. Role must be App Manager or Admin.
      - name: Install App Store Connect API key
        env:
          P8: ${{ secrets.APP_STORE_CONNECT_P8 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$P8" > ~/private_keys/AuthKey_${KEY_ID}.p8

      # Import the persistent signing identities so automatic signing reuses
      # them instead of minting per-run certs. `xcodebuild archive` signs with a
      # DEVELOPMENT identity (Distribution is applied at export), so without a
      # Development p12 here every run mints an "Apple Development: Created via
      # API" cert and eventually hits Apple's cap ("Choose a certificate to
      # revoke") — that's why the Development p12 matters as much as the
      # Distribution one. Each is optional; with neither set, cloud signing.
      - name: Import signing certificates
        env:
          P12_B64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASS: ${{ secrets.IOS_P12_PASSWORD }}
          DEV_P12_B64: ${{ secrets.IOS_DEV_P12_BASE64 }}
          DEV_P12_PASS: ${{ secrets.IOS_DEV_P12_PASSWORD }}
        run: |
          if [ -z "$P12_B64" ] && [ -z "$DEV_P12_B64" ]; then
            echo "No persistent cert secrets set — falling back to cloud-managed signing"
            exit 0
          fi
          KC="$RUNNER_TEMP/ci-signing.keychain-db"
          KC_PASS=$(uuidgen)
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          import_p12() { # $1=base64 $2=password $3=label
            printf '%s' "$1" | base64 --decode > "$RUNNER_TEMP/$3.p12"
            security import "$RUNNER_TEMP/$3.p12" -k "$KC" -P "$2" \
              -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/xcodebuild
            rm -f "$RUNNER_TEMP/$3.p12"
            echo "imported $3 identity"
          }
          [ -n "$P12_B64" ]     && import_p12 "$P12_B64"     "$P12_PASS"     dist
          [ -n "$DEV_P12_B64" ] && import_p12 "$DEV_P12_B64" "$DEV_P12_PASS" dev
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "KEYCHAIN=$KC" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$KC"

      - name: Build Flutter iOS (no codesign)
        run: |
          flutter build ios --release --no-codesign \
            --build-name=${{ steps.ver.outputs.version }} \
            --build-number=${{ steps.ver.outputs.build }}

      - name: Archive with automatic signing
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner -configuration Release \
            -archivePath build/Runner.xcarchive archive \
            -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates \
            -allowProvisioningDeviceRegistration \
            -authenticationKeyPath ~/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=W527ZN3X52

      - name: Export and upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath build/Runner.xcarchive \
            -exportOptionsPlist ios/ExportOptionsCI.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Clean up key + keychain
        if: always()
        run: |
          rm -rf ~/private_keys
          if [ -n "$KEYCHAIN" ]; then security delete-keychain "$KEYCHAIN" || true; fi
