name: iOS App Store screenshots

# Captures App Store screenshots by driving the real app on an iPad Pro
# simulator (integration_test), at the simulator's native resolution
# (2048x2732 / 2064x2752 — accepted ipad-13 sizes). Manual only: macOS runners
# bill ~10x, and screenshots are cut intentionally.
#
#   gh workflow run ios-screenshots.yml --ref main
#
# Output: an artifact `appstore-screenshots-ipad-13` with the PNGs, ready to
# drop into ios/appstore/screenshots/ipad-13/ and feed to the ASC uploader.
on:
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: ipad-13     # iPad Pro 13": 2064x2752 (covers all iPads)
            kind: ipad
          - device: iphone-6.9  # iPhone Pro Max: 1320x2868 (covers all iPhones)
            kind: iphone

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # A real simulator build generates the Podfile and runs pod install for
      # the plugin pods (path_provider, share_plus) — this repo has no committed
      # Podfile, and --config-only doesn't create one.
      - name: Build app for the simulator (generates Podfile + pods)
        run: flutter build ios --simulator --debug

      - name: Boot the ${{ matrix.device }} simulator
        id: sim
        run: |
          read RUNTIME DEVTYPE NAME < <(python3 tools/pick_ipad_sim.py ${{ matrix.kind }})
          echo "runtime: $RUNTIME"; echo "device type: $DEVTYPE ($NAME)"
          UDID=$(xcrun simctl create ShotDev "$DEVTYPE" "$RUNTIME")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Capture screenshots
        timeout-minutes: 12
        env:
          SHOT_DIR: ios/appstore/screenshots/${{ matrix.device }}
        run: |
          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/screenshots_test.dart \
            -d ${{ steps.sim.outputs.udid }}

      # Upload even if the capture test reported failures — the PNGs are written
      # as each screenshot is taken, so we still want to see them.
      - name: Strip alpha + report sizes
        if: always()
        run: |
          shopt -s nullglob
          for f in ios/appstore/screenshots/${{ matrix.device }}/*.png; do
            mogrify -alpha off "$f"
            echo "$(sips -g pixelWidth -g pixelHeight "$f" | tr '\n' ' ')  $f"
          done

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appstore-screenshots-${{ matrix.device }}
          path: ios/appstore/screenshots/${{ matrix.device }}/*.png
          if-no-files-found: error
